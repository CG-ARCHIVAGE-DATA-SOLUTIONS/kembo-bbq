# ─────────────────────────────────────────────────────────────────────────────
#  Kembo BBQ — docker-compose.prod.yml
#
#  Prérequis VPS :
#    • Traefik tourne sur le réseau Docker externe "proxy_net"
#    • Le fichier .env est présent à côté de ce fichier (copié depuis .env.example)
#
#  Démarrage initial :
#    docker compose -f docker-compose.prod.yml up -d --build
#
#  Mise à jour de l'image :
#    docker compose -f docker-compose.prod.yml build --no-cache
#    docker compose -f docker-compose.prod.yml up -d
#
#  Accès logs :
#    docker compose -f docker-compose.prod.yml logs -f app
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Application Next.js (caisse + gestion) ───────────────────────────────
  app:
    container_name: kembo-bbq
    image: kembo-bbq:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
      # Chemin SQLite dans le volume — prend le dessus sur .env
      - DATABASE_URL=file:/data/kembo.db
      - TZ=Africa/Brazzaville
    volumes:
      - kembo_data:/data
    networks:
      - kembo
      - proxy_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy_net"

      # ── Middlewares ───────────────────────────────────────────────────────
      - "traefik.http.middlewares.kembo-compress.compress=true"

      - "traefik.http.middlewares.kembo-security.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.kembo-security.headers.browserXssFilter=true"
      - "traefik.http.middlewares.kembo-security.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.kembo-security.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.kembo-security.headers.stsPreload=true"

      - "traefik.http.middlewares.kembo-ratelimit.ratelimit.average=60"
      - "traefik.http.middlewares.kembo-ratelimit.ratelimit.burst=20"

      - "traefik.http.middlewares.kembo-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.kembo-redirect.redirectscheme.permanent=true"

      # ── Routeur HTTPS ─────────────────────────────────────────────────────
      - "traefik.http.routers.kembo-secure.rule=Host(`kembbbq.ads-cg.com`)"
      - "traefik.http.routers.kembo-secure.entrypoints=${TRAEFIK_ENTRYPOINT_HTTPS:-websecure}"
      - "traefik.http.routers.kembo-secure.tls=true"
      - "traefik.http.routers.kembo-secure.tls.certresolver=${TRAEFIK_CERTRESOLVER:-cloudflare}"
      - "traefik.http.routers.kembo-secure.service=kembo-service"
      - "traefik.http.routers.kembo-secure.middlewares=kembo-compress,kembo-security,kembo-ratelimit"

      # ── Routeur HTTP → redirect HTTPS ─────────────────────────────────────
      - "traefik.http.routers.kembo-insecure.rule=Host(`kembbbq.ads-cg.com`)"
      - "traefik.http.routers.kembo-insecure.entrypoints=${TRAEFIK_ENTRYPOINT_HTTP:-web}"
      - "traefik.http.routers.kembo-insecure.middlewares=kembo-redirect"

      # ── Service ───────────────────────────────────────────────────────────
      - "traefik.http.services.kembo-service.loadbalancer.server.port=3000"
      - "traefik.http.services.kembo-service.loadbalancer.healthcheck.path=/api/health"
      - "traefik.http.services.kembo-service.loadbalancer.healthcheck.interval=30s"

volumes:
  kembo_data:
    # Volume nommé Docker : SQLite + flag seed
    # Sauvegarde : docker run --rm -v kembo_data:/data -v $(pwd):/backup \
    #              alpine tar czf /backup/kembo-backup-$(date +%Y%m%d).tar.gz /data

networks:
  kembo:
    driver: bridge
  proxy_net:
    external: true   # réseau créé par votre stack Traefik sur le VPS
